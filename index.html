<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

      Sicherheit: Die Seite darf nur eigene Dateien laden und Verbindungen nur zu sich
      selbst und zur Anthropic-API aufbauen (für die optionale KI). Kein Tracking möglich.
    -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />

    <meta name="theme-color" content="#f6f5f1" />

    <title>Lingua</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme-boot.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <header class="app-header"></header>
    <nav class="app-nav" aria-label="Hauptnavigation" hidden></nav>
    <div id="banner" class="banner"></div>
    <main id="main" tabindex="-1">
      <p class="loading">Lingua wird geladen …</p>

        <p>Lingua braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
      </noscript>
    </main>
  </body>
</html>
